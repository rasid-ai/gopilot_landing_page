# Netlify deploy config for the GoPilot landing page.
#
# Being explicit here is not optional. Netlify auto-detects Next.js and enables
# @netlify/plugin-nextjs, which expects a server build in `.next`. This project
# sets `output: 'export'` in next.config.ts, so there is no server bundle and the
# deployable artifact is `out/`. Declaring `publish = "out"` is what tells
# Netlify to serve the pre-rendered files instead of looking for a runtime.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Next 15 requires Node 18.18+ / 20.9+. Pinned so a change to Netlify's
  # default image cannot alter the build out from under us. Matches .nvmrc.
  NODE_VERSION = "20"

  # `npm ci` honours package-lock.json exactly. Netlify runs it by default when
  # a lockfile is present; this makes the intent explicit.
  NPM_FLAGS = "--prefer-offline --no-audit"

# ---------------------------------------------------------------------------
# Caching
#
# Everything under /_next/static/ is content-hashed by the build, so a changed
# file always arrives under a new URL and these can be cached permanently.
# The HTML must NOT be, or visitors keep an old page after a deploy.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts are self-hosted and versioned by filename (see app/fonts/).
[[headers]]
  for = "/_next/static/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Brand marks and the demo capture are stable but not content-hashed, so give
# them a long-ish TTL with revalidation rather than immutability.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/demo/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# ---------------------------------------------------------------------------
# Security headers
#
# Deliberately no Content-Security-Policy. Next injects inline bootstrap
# scripts and this page emits inline <script type="application/ld+json"> for the
# structured data, so a strict policy would need nonces that a static export
# cannot generate at request time. A broken CSP that blocks the JSON-LD would
# cost the rich result it exists to earn. The headers below are the ones that
# are unambiguously safe for a static marketing page.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # No camera/mic/geolocation is used anywhere on this page.
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ---------------------------------------------------------------------------
# Deploy previews and branch builds must not be indexed. They serve the same
# content as production, and although every page carries a canonical pointing
# at https://gopilot.earth/, a crawler is free to ignore that. The header is
# the unambiguous signal.
# ---------------------------------------------------------------------------

[context.deploy-preview]
  [context.deploy-preview.environment]
    NEXT_PUBLIC_SITE_URL = "https://gopilot.earth"

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[context.branch-deploy]
  [context.branch-deploy.environment]
    NEXT_PUBLIC_SITE_URL = "https://gopilot.earth"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"
